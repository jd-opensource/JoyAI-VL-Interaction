map $http_upgrade $joyvl_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream joyvl_webui {
    server 127.0.0.1:7099;
    keepalive 128;
}

server {
    listen 7100 ssl http2;
    listen [::]:7100 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate /etc/nginx/joyvl/fullchain.pem;
    ssl_certificate_key /etc/nginx/joyvl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:JoyVL:20m;
    ssl_session_timeout 1d;

    auth_basic "JoyAI VL Interaction";
    auth_basic_user_file /etc/nginx/joyvl/.htpasswd;

    client_max_body_size 0;
    client_body_timeout 24h;
    send_timeout 24h;

    access_log /var/log/nginx/joyvl-access.log;
    error_log /var/log/nginx/joyvl-error.log warn;

    location / {
        proxy_pass https://joyvl_webui;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 7099;
        proxy_set_header Authorization "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $joyvl_connection_upgrade;

        proxy_ssl_verify off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 30s;
        proxy_send_timeout 24h;
        proxy_read_timeout 24h;
    }
}
