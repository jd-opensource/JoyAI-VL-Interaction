# coturn TURN server configuration for SSH-tunnel / internal-network deployments.
#
# Goal: make WebRTC media traverse a plain SSH (TCP-only) tunnel by forcing all
# media through a local TURN-over-TCP relay. The browser (on your Mac, via SSH
# port-forward) and aiortc (on the GPU server) both talk only to 127.0.0.1, so
# no real server IP / UDP path is ever required.
#
# Started automatically by: services/webui/scripts/start_server_tunnel.sh
# Tunnel with: ssh -L 8099:127.0.0.1:8099 -L 3478:127.0.0.1:3478 user@gpu-server

# --- Listening (TURN signalling) --------------------------------------------
# Bind only to loopback; the port is reached from your Mac through the SSH tunnel.
listening-ip=127.0.0.1
listening-port=3478

# --- Relay (where media is forwarded) ---------------------------------------
# Relay on loopback so aiortc (same host) can reach the allocated relay address
# without any external/UDP path.
relay-ip=127.0.0.1

# Constrain the relay port range so it is predictable (useful for debugging /
# firewalling). These ports stay on the GPU server's loopback only.
min-port=49160
max-port=49200

# --- Authentication ----------------------------------------------------------
# Static long-term credentials. Must match WEBRTC_TURN_USERNAME / _PASSWORD
# passed to the webui server. CHANGE THESE for anything beyond local testing.
lt-cred-mech
user=joyvl:joyvl-turn-secret
realm=joyvl.local

# --- Hardening / behaviour ---------------------------------------------------
# We only ever relay on loopback, so disable multicast peers and external IPs.
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Keep logs readable; raise verbosity by removing 'simple-log' if debugging.
simple-log
fingerprint
