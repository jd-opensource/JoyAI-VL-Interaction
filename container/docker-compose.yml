  warmup-asr:
    image: joyai-vl-asr-adapter:latest
    build:
      context: .
      network: host
      dockerfile: Dockerfile.asr-adapter
    working_dir: /workspace/JoyAI-VL-Interaction-main
    environment:
      ASR_ADAPTER_PORT: "${ASR_ADAPTER_PORT:-8994}"
      ASR_WARMUP_TIMEOUT: "${ASR_WARMUP_TIMEOUT:-180}"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "/workspace/JoyAI-VL-Interaction-main/services/asr"
    volumes:
      - "${CODE_ROOT:-..}:/workspace/JoyAI-VL-Interaction-main:ro"
    depends_on:
      asr-adapter:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -euo pipefail
        python3 - <<'PY'
        import math
        import struct
        import wave
        from pathlib import Path

        sample_rate = 16000
        duration_seconds = 1.0
        output = Path("/tmp/joyai-asr-warmup.wav")
        frames = bytearray()
        for i in range(int(sample_rate * duration_seconds)):
            value = int(1200 * math.sin(2 * math.pi * 440 * i / sample_rate))
            frames.extend(struct.pack("<h", value))

        with wave.open(str(output), "wb") as wav_file:
            wav_file.setnchannels(1)
            wav_file.setsampwidth(2)
            wav_file.setframerate(sample_rate)
            wav_file.writeframes(bytes(frames))
        PY
        python3 services/asr/asr_adapter.py smoke \
          --url "ws://asr-adapter:$${ASR_ADAPTER_PORT}/ws/asr" \
          --wav /tmp/joyai-asr-warmup.wav \
          --timeout "$${ASR_WARMUP_TIMEOUT}"
    restart: "no"

